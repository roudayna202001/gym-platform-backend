{% extends 'base.html' %}
{% block title %}Connexion - GymPro{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body p-4">
        <h3 class="text-center mb-4"><i class="bi bi-lightning-charge-fill text-warning"></i> GymPro</h3>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold">Se connecter</button>
        </form>
      </div>
    </div>
    <div class="text-center mt-3 text-muted small">
      Comptes de démo (mot de passe <code>123456</code>) :<br>
      directeur@gym.com · coach@gym.com · eleve@gym.com
    </div>
  </div>
</div>
{% endblock %}
