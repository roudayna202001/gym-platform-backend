{% extends 'base.html' %}
{% block title %}Ajouter un élève{% endblock %}
{% block content %}
<h2 class="mb-4">Ajouter un élève</h2>
<form method="POST" class="card p-4 shadow-sm" style="max-width:700px;">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Prénom</label><input name="prenom" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Nom</label><input name="nom" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
    <div class="col-md-6"><label class="form-label">Téléphone</label><input name="telephone" class="form-control"></div>
    <div class="col-md-6">
      <label class="form-label">Type d'abonnement</label>
      <select name="abonnement_type" class="form-select">
        <option value="Mensuel">Mensuel</option>
        <option value="Trimestriel">Trimestriel</option>
        <option value="Annuel">Annuel</option>
      </select>
    </div>
    <div class="col-md-6"><label class="form-label">Mot de passe</label><input type="password" name="password" class="form-control" required></div>
  </div>
  <div class="mt-3">
    <button class="btn btn-success">Enregistrer</button>
    <a href="{{ url_for('directeur.eleves') }}" class="btn btn-outline-secondary">Annuler</a>
  </div>
</form>
{% endblock %}
